version: '3.9'

services:
  # =========================
  # PostgreSQL (samo za MUP)
  # =========================
  postgres:
    image: postgres:15
    container_name: mup_postgres
    environment:
      POSTGRES_DB: mup_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mup_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # MongoDB (samo za AUTH)
  # =========================
  mongo-auth:
    image: mongo:7
    container_name: mongo_auth
    ports:
      - "27017:27017"
    volumes:
      - mongo_auth_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================
  # AUTH SERVICE (MongoDB)
  # =========================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAIN_CLASS: auth_service.AuthServiceApplication
    container_name: auth_service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo-auth:27017/auth_db
    depends_on:
      mongo-auth:
        condition: service_healthy

  # =========================
  # MUP SERVICE (PostgreSQL)
  # =========================
  mup-service:
    build:
      context: .
      dockerfile: Dockerfile.mup
    container_name: mup_service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mup_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: mup
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  # =========================
  # OPENDATA SERVICE
  # =========================
  opendata-service:
    build:
      context: .
      dockerfile: Dockerfile.opendata
    container_name: opendata_service
    ports:
      - "8082:8082"
    environment:
      SERVICES_AUTH-URL: http://auth-service:8080/api/auth
      SERVICES_MUP-URL: http://mup-service:8081/api/zahtevi
      SPRING_PROFILES_ACTIVE: opendata
    depends_on:
      auth-service:
        condition: service_started
      mup-service:
        condition: service_started

volumes:
  postgres_data:
  mongo_auth_data:
